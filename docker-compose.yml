version: '3.8'

services:
  ios-collector:
    build: .
    container_name: ios-ota-collector
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - PORT=3000
    volumes:
      # Mount config directory for customization
      - ./config:/app/config
      # Persist generated certificates
      - certs-data:/app/config/certs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - collector-network

volumes:
  certs-data:
    driver: local

networks:
  collector-network:
    driver: bridge
